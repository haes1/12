name: Unzip and build EyeSwipe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/unzip.yml'

permissions:
  contents: write

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack archive
        run: |
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using archive: $ZIP"
          rm -rf EyeSwipe _unzip
          mkdir -p _unzip
          unzip -o "$ZIP" -d _unzip
          COUNT=$(ls -1A _unzip | wc -l)
          FIRST=$(ls -1A _unzip | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "_unzip/$FIRST" ]; then
            mv "_unzip/$FIRST" EyeSwipe
          else
            mv _unzip EyeSwipe
          fi
          rm -rf _unzip
          find EyeSwipe -type f | sort

      - name: Align toolchain with dependency requirements
        working-directory: EyeSwipe
        run: |
          # CameraX 1.6.x / media3 1.9.x need AGP 8.9.1+ and compileSdk 36
          sed -i -E 's/(com\.android\.application\"\) version \")[^\"]+/\18.9.1/' build.gradle.kts
          sed -i -E 's/(org\.jetbrains\.kotlin\.android\"\) version \")[^\"]+/\12.0.21/' build.gradle.kts
          sed -i -E 's/compileSdk *= *[0-9]+/compileSdk = 36/' app/build.gradle.kts
          echo '--- build.gradle.kts ---'
          cat build.gradle.kts
          echo '--- app/build.gradle.kts (head) ---'
          head -20 app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: EyeSwipe
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EyeSwipe-debug-apk
          path: EyeSwipe/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish sources, APK and build log back to the repo
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f EyeSwipe/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp EyeSwipe/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
            echo "status: SUCCESS" > artifacts/build-status.txt
          else
            echo "status: FAILED" > artifacts/build-status.txt
          fi
          tail -n 150 build.log >> artifacts/build-status.txt || true
          rm -rf EyeSwipe/build EyeSwipe/app/build EyeSwipe/.gradle
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A EyeSwipe artifacts
          git commit -m "Unpack archive and publish APK build result" || echo "nothing to commit"
          git pull --rebase
          git push
