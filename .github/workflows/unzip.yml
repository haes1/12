name: Unzip and build EyeSwipe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/unzip.yml'

permissions:
  contents: write

env:
  ARCHIVE: EyeSwipe_android11_checked.zip

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove everything except the archive and this workflow
        run: |
          git rm -r --cached . -q
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ARCHIVE" \
            -exec rm -rf {} +
          find .github -mindepth 1 ! -path '.github/workflows' ! -path '.github/workflows/unzip.yml' -maxdepth 2 -exec rm -rf {} + || true
          ls -la

      - name: Unpack archive
        run: |
          rm -rf EyeSwipe _unzip
          mkdir -p _unzip
          unzip -o "$ARCHIVE" -d _unzip
          COUNT=$(ls -1A _unzip | wc -l)
          FIRST=$(ls -1A _unzip | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "_unzip/$FIRST" ]; then
            mv "_unzip/$FIRST" EyeSwipe
          else
            mv _unzip EyeSwipe
          fi
          rm -rf _unzip
          find EyeSwipe -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (as-is)
        id: build
        continue-on-error: true
        working-directory: EyeSwipe
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Retry with newer AGP/compileSdk if needed
        id: retry
        if: steps.build.outcome != 'success'
        continue-on-error: true
        working-directory: EyeSwipe
        run: |
          set -o pipefail
          sed -i -E 's/(com\.android\.application\"\) version \")[^\"]+/\18.9.1/' build.gradle.kts
          sed -i -E 's/(org\.jetbrains\.kotlin\.android\"\) version \")[^\"]+/\12.0.21/' build.gradle.kts
          sed -i -E 's/compileSdk *= *[0-9]+/compileSdk = 36/' app/build.gradle.kts
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success' || steps.retry.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EyeSwipe-debug-apk
          path: EyeSwipe/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish sources, APK and build log back to the repo
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f EyeSwipe/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp EyeSwipe/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
            echo "status: SUCCESS" > artifacts/build-status.txt
          else
            echo "status: FAILED" > artifacts/build-status.txt
          fi
          tail -n 150 build.log >> artifacts/build-status.txt || true
          rm -rf EyeSwipe/build EyeSwipe/app/build EyeSwipe/.gradle
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean repo, unpack $ARCHIVE, publish APK build result" || echo "nothing to commit"
          git pull --rebase
          git push
