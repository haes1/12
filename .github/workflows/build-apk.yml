name: Build EyeSwipe APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'EyeSwipe/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EyeSwipe
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EyeSwipe-debug-apk
          path: EyeSwipe/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK and build log back to the repo
        if: always()
        working-directory: .
        run: |
          mkdir -p artifacts
          if [ -f EyeSwipe/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp EyeSwipe/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
            echo "status: SUCCESS" > artifacts/build-status.txt
          else
            echo "status: FAILED" > artifacts/build-status.txt
          fi
          tail -n 120 build.log >> artifacts/build-status.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A artifacts
          git commit -m "Publish EyeSwipe APK build result" || echo "nothing to commit"
          git pull --rebase
          git push
